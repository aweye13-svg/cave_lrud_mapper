<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark cavern background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242b"/>
      <stop offset="100%" stop-color="#0f1318"/>
    </linearGradient>
    <!-- Octagon passage ring gradient -->
    <linearGradient id="conduitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Wall depth shading -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Rounded base container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Mountain karst ridge on surface -->
  <path d="M 6 22 L 18 10 L 29 19 L 41 7 L 58 22" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subsurface depth projection cone -->
  <polygon points="18,10 50,44 14,44" fill="url(#wallGrad)" opacity="0.6"/>

  <!-- Octagonal Conduit (Outer Profile) -->
  <polygon points="32,22 43,26 48,37 43,48 32,52 21,48 16,37 21,26" 
           fill="#0c1929" stroke="url(#conduitGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner Octagon Chamber Ring -->
  <polygon points="32,28 39,31 42,37 39,43 32,46 25,43 22,37 25,31" 
           fill="#030712" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- LRUD Crosshairs (Left, Right, Up, Down dimension vectors) -->
  <line x1="32" y1="22" x2="32" y2="52" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>
  <line x1="16" y1="37" x2="48" y2="37" stroke="#38bdf8" stroke-width="1.2" opacity="0.75"/>

  <!-- Centerline Survey Vector Traversing Through Depth -->
  <polyline points="18,10 25,24 32,37 44,42 54,49" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Survey Stations (Nodes) -->
  <circle cx="18" cy="10" r="2.8" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>  <!-- Entrance A0 -->
  <circle cx="25" cy="24" r="2.0" fill="#f97316"/>
  <circle cx="32" cy="37" r="2.4" fill="#fbbf24" stroke="#ffffff" stroke-width="0.8"/> <!-- Center station -->
  <circle cx="44" cy="42" r="1.8" fill="#f97316"/>
  <circle cx="54" cy="49" r="2.0" fill="#f97316"/>

  <!-- Entrance GPS Signal Reticle -->
  <circle cx="18" cy="10" r="5.5" fill="none" stroke="#ef4444" stroke-width="0.9" stroke-dasharray="2,2"/>
</svg>
